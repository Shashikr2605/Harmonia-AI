# Temporary override: removes MinIO/mc images (Docker Hub auth required)
services:
  minio:
    image: redis:7-alpine
    command: ["redis-server", "--port", "9999"]
    restart: "no"
    healthcheck:
      test: ["CMD", "true"]
      interval: 1s
      timeout: 1s
      retries: 1

  createbuckets:
    image: redis:7-alpine
    command: ["echo", "disabled"]
    restart: "no"
    depends_on: []

  api:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    environment:
      - R2_ACCOUNT_ID=local
      - R2_ACCESS_KEY_ID=minioadmin
      - R2_SECRET_ACCESS_KEY=minioadmin
      - R2_BUCKET_NAME=harmonia-audio
      - R2_ENDPOINT_URL=http://localhost:9000
      - S3_PRESIGN_ENDPOINT_URL=http://localhost:9000
      - S3_REGION=us-east-1

  audio_worker:
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
